# This is a basic workflow to help you get started with Actions

name: CI-MAIN

# Controls when the action will run. 
on:
  # Allows you to run this workflow manually from the Actions tab
  repository_dispatch: 
    types: [trigger]
  workflow_dispatch:
    inputs:
      version:
        description: Version to install
        required: true
        default: latest
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  deploy:
    # The type of runner that the job will run on
    runs-on: [self-hosted, hkube-self-hosted-cd-manager]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - name: select kube context
        run: |
          # single kubeconfig on the runner holds all cluster contexts; select via --context, do not mutate the shared file
          echo KUBECONFIG=/etc/hkube/kube/config >> $GITHUB_ENV
          echo KUBE_CONTEXT=cicd-lz.hkube.org >> $GITHUB_ENV
      - name: verify kubectl
        run: kubectl --context "$KUBE_CONTEXT" cluster-info
      - name: deploy
        run: ./deploy.sh ${{ secrets.HKUBE_DOMAIN_RAW }}
        env:
          DOCKER_BUILD_PUSH_PASSWORD: ${{ secrets.DOCKER_BUILD_PUSH_PASSWORD }}
          DOCKER_BUILD_PUSH_USERNAME: ${{ secrets.DOCKER_BUILD_PUSH_USERNAME }}
          IMAGE_PULL_USERNAME: ${{ secrets.IMAGE_PULL_USERNAME }}
          IMAGE_PULL_PASSWORD: ${{ secrets.IMAGE_PULL_PASSWORD }}
          VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
          KEYCLOAK_ADMIN_PASS: ${{ secrets.KC_ADMIN_PASSWORD }}
  test:
    runs-on: [self-hosted, hkube-self-hosted-cd-manager]
    needs: deploy
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: select kube context
        run: |
          # single kubeconfig on the runner holds all cluster contexts; select via --context, do not mutate the shared file
          echo KUBECONFIG=/etc/hkube/kube/config >> $GITHUB_ENV
          echo KUBE_CONTEXT=cicd-lz.hkube.org >> $GITHUB_ENV
      - name: verify kubectl
        run: kubectl --context "$KUBE_CONTEXT" cluster-info
      - name: test
        run: ./test.sh
        env:
          CLUSTER_URL: ${{ vars.CICD_LZ_URL }}
          # in-VPC path hits the ingress default cert
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          KEYCLOAK_GUEST_PASS: ${{ secrets.KEYCLOAK_GUEST_PASS }}
          KEYCLOAK_GUEST_USER: ${{ secrets.KEYCLOAK_GUEST_USER }}
      

